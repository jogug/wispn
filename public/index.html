<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>wispn — ghost-mime sanctuary</title><link rel="stylesheet" href="/style.css"></head>
<body>

<main id="stage"><canvas id="world"></canvas>
<p id="empty">No sanctuary yet. Open one, or paste a link with <code>#&lt;id&gt;</code>.</p></main>
<section id="limbo" hidden><div class="limbo-inner"><div class="heroPane"><h2>Limbo Threshold</h2><canvas id="hero" width="360" height="360"></canvas><button id="releaseBtn">Release Into Sanctuary</button><button id="closeLimbo">Close</button></div>
<div class="panel">
<div class="psec"><h3>Body colour</h3><div class="row"><input type="color" id="bodyColor" value="#f8fafc"><div id="bodySwatches" class="swatches"></div></div></div>
<div class="psec"><h3>Facial hair colour</h3><div class="row"><label>Colour <input type="color" id="hairColor" value="#fef9c3"></label><div id="hairSwatches" class="swatches"></div></div></div>
<div class="psec"><h3>Face</h3><div id="eyeCards" class="cards"></div><div class="row"><button id="mustBtn" class="tog">Mustache</button><button id="beardBtn" class="tog">Beard</button></div></div>
<div class="psec"><h3>Hat and item</h3><div id="hatCards" class="cards"></div><div id="itemCards" class="cards"></div></div>
<div class="psec"><h3>Arm gesture</h3><div id="gestureCards" class="cards"></div></div>
<div class="psec"><h3>Mime loop and tempo</h3><div class="row"><select id="fBeat0"></select><select id="fBeat1"></select><select id="fBeat2"></select></div><label>Tempo <input id="fTempo" type="range" min="0" max="3" value="1"></label>
<label id="envWrap" hidden>Environment <select id="envSel"><option value="0">Forest</option><option value="1">Heaven</option><option value="2">Sea</option><option value="3">Dunes</option><option value="4">Mountain</option><option value="5">Beach</option></select></label></div>
</div></div></section>
<nav id="bottomBar"><span class="brand">👻 wispn</span><span id="roleBadge" class="badge">visitor</span><button id="shareBtn">Share</button><button id="openBtn">Open Sanctuary</button><button id="limboBtn">Enter Limbo</button></nav>
<div id="toast"></div>
<script src="/app.js"></script></body></html>
