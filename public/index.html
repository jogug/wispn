<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>wispn — ghost-mime sanctuary</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><a class="logo" href="#">👻 wispn</a><span id="roleBadge" class="badge">visitor</span>
<button id="shareBtn">Share</button><button id="openBtn">Open Sanctuary</button><button id="limboBtn">Enter Limbo</button></header>
<main id="stage"><canvas id="world"></canvas><div id="mist">drag your wisp into the mist to re-dress</div>
<p id="empty">No sanctuary yet. Open one, or paste a link with <code>#&lt;id&gt;</code>.</p></main>
<section id="limbo" hidden><div class="limbo-inner"><h2>Limbo Threshold</h2><canvas id="hero" width="360" height="360"></canvas>
<div class="controls"><label>Tint <select id="fTint"></select></label><label>Eyes <select id="fEyes"></select></label>
<label>Hair <select id="fHair"></select></label><label>Hair colour <select id="fHairColor"></select></label><label>Item <select id="fItem"></select></label><label>Hat <select id="fHat"></select></label>
<label>Tempo <input id="fTempo" type="range" min="0" max="3" value="1"></label>
<label id="envWrap" hidden>Environment <select id="envSel"><option value="0">Forest</option><option value="1">Heaven</option><option value="2">Sea</option><option value="3">Dunes</option><option value="4">Mountain</option><option value="5">Beach</option></select></label>
<fieldset><legend>3-beat mime loop</legend><select id="fBeat0"></select><select id="fBeat1"></select><select id="fBeat2"></select></fieldset></div>
<button id="releaseBtn">Release Into Sanctuary</button><button id="closeLimbo">Close</button></div></section>
<div id="toast"></div>
<script src="/app.js"></script></body></html>
