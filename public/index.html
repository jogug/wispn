<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>wispn — ghost-mime sanctuary</title><link rel="stylesheet" href="/style.css"></head>
<body>

<main id="stage"><canvas id="world"></canvas>
<p id="empty">No sanctuary yet. Open one, or paste a link with <code>#&lt;id&gt;</code>.</p></main>
<section id="limbo" hidden><div class="limbo-inner"><div class="heroPane"><h2>Limbo Threshold</h2><canvas id="hero" width="360" height="360"></canvas></div>
<div class="panel"><div class="psec"><h3>Biome</h3><label id="envWrap">Environment <select id="envSel"><option value="0">Forest</option><option value="1">Heaven</option><option value="2">Sea</option><option value="3">Dunes</option><option value="4">Mountain</option><option value="5">Beach</option></select></label></div>
<div class="psec"><h3>Body colour</h3><div class="row"><input type="color" id="bodyColor" value="#f8fafc"><div id="bodySwatches" class="swatches"></div></div></div>
<div class="psec"><h3>Face</h3><div id="eyeCards" class="cards"></div></div>
<div class="psec"><h3>Hat and item</h3><div id="hatCards" class="cards"></div><div id="itemCards" class="cards"></div></div>
<div class="psec"><h3>Arm gesture</h3><div id="gestureCards" class="cards"></div></div>
<div class="psec"><h3>Mime loop and tempo</h3><div class="row"><select id="fBeat0"></select><select id="fBeat1"></select><select id="fBeat2"></select></div><label>Tempo <input id="fTempo" type="range" min="0" max="3" value="1"></label>
</div>
</div><div class="limboActions"><button id="closeLimbo">Close</button><button id="releaseBtn">Save</button></div></div></section>
<nav id="bottomBar"><span class="brand">👻 wispn</span><span id="roleBadge" class="badge">visitor</span><button id="shareBtn" aria-label="Share" title="Share"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button><button id="openBtn" aria-label="New sanctuary" title="New sanctuary"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></button><button id="limboBtn" aria-label="Enter Limbo" title="Enter Limbo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3a7 7 0 0 0-7 7v11l2.3-1.6L9.6 21l2.4-1.6L14.4 21l2.3-1.6L19 21V10a7 7 0 0 0-7-7z"/><circle cx="9.5" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="14.5" cy="10" r="1" fill="currentColor" stroke="none"/></svg></button></nav>
<div id="toast"></div>
<script src="/app.js"></script></body></html>
